name: Daily ENTSO-E Ingestion to BigQuery

on:
  schedule:
    # Runs automatically at 04:00 UTC every day (05:00 / 06:00 Swiss local time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allows manual trigger execution from the GitHub UI for testing

jobs:
  ingest-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Swiss Grid Load Ingestion Script
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python swiss-energy-pipeline/ingest_swiss_load.py
