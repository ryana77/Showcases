name: Daily ENTSO-E Ingestion to BigQuery

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ingest-data:
    runs-on: ubuntu-latest

    steps:
      # Updated from v4 to v5
      - name: Checkout repository code
        uses: actions/checkout@v5

      # Updated from v5 to v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Updated from v2 to v3
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Swiss Grid Load Ingestion Script
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python swiss_energy_pipeline/ingest_swiss_load.py
